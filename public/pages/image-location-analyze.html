<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicTrip | 위치 기반 여행지 추천</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/image-location-analyze.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <section class="loc-hero">
        <div class="loc-hero-inner">
          <div class="loc-hero-badge">
            <span class="loc-hero-badge-pulse"></span>
            AI 위치 분석
          </div>
          <h1 class="loc-hero-title">
            사진 속 장소를 추정하고<br />여행지를 추천해 드립니다
          </h1>
          <p class="loc-hero-desc">
            사진을 업로드하고 힌트를 입력해 주세요.<br />
            AI가 사진 속 위치를 추정하고, 그 주변에서 어울리는 여행지를 추천합니다.
          </p>
        </div>
      </section>

      <section class="loc-section">
        <div class="loc-container">
          <button type="button" class="back-btn">뒤로가기</button>

          <div class="loc-card">
            <div class="loc-card-grid">
              <div class="loc-form-col">
                <p class="loc-section-label">이미지 업로드</p>
                <input
                  id="locationImageInput"
                  type="file"
                  accept="image/*"
                  class="loc-file-input"
                />
                <label
                  for="locationImageInput"
                  id="locationUploadBox"
                  class="upload-box"
                >
                  <div id="locationPlaceholder" class="upload-placeholder">
                    <svg
                      width="40"
                      height="40"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.6"
                        d="M4 16l4.5-4.5a2 2 0 012.8 0L16 16m-2-2l1.5-1.5a2 2 0 012.8 0L20 14M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                      />
                    </svg>
                    <p class="upload-placeholder-text">사진을 업로드해 주세요</p>
                    <p class="upload-placeholder-sub">JPG, PNG · 최대 10MB</p>
                  </div>
                  <img
                    id="locationPreview"
                    class="preview d-none"
                    alt="위치 추천 이미지 미리보기"
                  />
                </label>

                <div class="loc-field">
                  <label for="locationHintInput" class="loc-field-label">힌트 텍스트</label>
                  <input
                    id="locationHintInput"
                    type="text"
                    class="loc-input"
                    placeholder="예: 바다, 좁은 골목, 야자수"
                  />
                </div>

                <div class="loc-actions d-flex flex-column align-items-stretch">
                  <button
                    id="locationRecommendBtn"
                    type="button"
                    class="btn-loc-primary"
                    disabled
                  >
                    위치 기반 여행지 추천
                  </button>
                  <button
                    id="moveToMoodBtn"
                    type="button"
                    class="btn-loc-secondary d-none"
                  >
                    분위기 기반 추천 받기
                  </button>
                </div>

                <div id="locationStatus" class="status"></div>
                <div id="locationError" class="error-box"></div>
              </div>

              <div class="loc-form-col">
                <p class="loc-section-label">사진 속 추정 위치</p>
                <div id="locationEstimatedResult"></div>
              </div>
            </div>
          </div>

          <div id="locationRecommendationResult" class="result"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fd290fec1340d8ed510dcf21731d2b08&autoload=false&libraries=services"
    ></script>
    <script type="module">
      import { renderHeader } from "/js/components/header.js";
      import { renderFooter } from "/js/components/footer.js";
      renderHeader({ active: "image-location-analyze" });
      renderFooter();
    </script>
    <script src="/js/pages/image-location-analyze.js"></script>
  </body>
</html>
